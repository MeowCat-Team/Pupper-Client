name: Build and Release

permissions:
  contents: read

on:
  push:
    branches: [ main, master, 'ver/**' ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main, master, 'ver/**' ]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or retry the current version on GitHub and Modrinth
        type: boolean
        default: true

# Do not interrupt a release between the two publishing platforms.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release trigger
        id: metadata
        run: python3 .github/scripts/release.py prepare

      - name: Check release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Validate packaged mod
        run: python3 .github/scripts/release.py verify

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pupper-client-${{ github.sha }}
          path: |
            ${{ steps.metadata.outputs.jar }}
            build/release/notes.md
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Download the verified JAR and release notes
        uses: actions/download-artifact@v4
        with:
          name: pupper-client-${{ github.sha }}
          path: build

      - name: Publish to GitHub Release and Modrinth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          chmod +x gradlew
          python3 .github/scripts/release.py publish
