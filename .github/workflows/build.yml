name: Build JAR

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '*.md'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PupperClient-Fabric
          path: |
            build/libs/PupperClient-Fabric-*.jar
            !build/libs/*-sources.jar

      - name: Resolve release JAR
        if: github.event_name == 'release'
        id: release_jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -type f -name 'PupperClient-Fabric-*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$JAR_PATH"
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.release_jar.outputs.path }}" --clobber
