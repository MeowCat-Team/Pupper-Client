plugins {
    id 'java-library'
    id 'architectury-plugin'
    id 'dev.architectury.loom-no-remap'
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
}

base { archivesName = "${rootProject.property('archives_base_name')}-Fabric" }
architectury {
    platformSetupLoomIde()
    fabric()
}
loom {
    accessWidenerPath = project(':common').file('src/main/resources/pupper.classtweaker')
    injectAccessWidener(tasks.named('jar'))
    runs {
        client {
            runDir = '../run/fabric'
            vmArgs '-Xms512M', '-Xmx4G', '-XX:HeapBaseMinAddress=34g', '--enable-native-access=ALL-UNNAMED'
        }
    }
}
configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}
apply from: rootProject.file('gradle/libraries.gradle.kts')

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.property('fabric_api_version')}"
    implementation libs.architectury.fabric
    implementation libs.viafabricplus.api
    runtimeOnly libs.viafabricplus
    runtimeOnly libs.sodium
    runtimeOnly libs.iris
    runtimeOnly libs.lithium
    runtimeOnly libs.immediatelyfast
    runtimeOnly libs.entityculling
    runtimeOnly libs.ias
    runtimeOnly libs.modmenu
    runtimeOnly libs.placeholder.api
    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    def metadata = [version: project.version, minecraft_version: rootProject.property('minecraft_version'),
        loader_version: rootProject.property('loader_version'), fabric_api_version: rootProject.property('fabric_api_version'),
        architectury_api_version: rootProject.property('architectury_api_version')]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
}

jar { archiveClassifier = 'raw' }
shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from { zipTree(jar.archiveFile.get().asFile) }
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = ''
    exclude 'architectury.common.json'
    from(rootProject.file('LICENSE'))
}
assemble.dependsOn shadowJar
sourcesJar {
    dependsOn project(':common').tasks.named('sourcesJar')
    from { zipTree(project(':common').tasks.named('sourcesJar').get().archiveFile.get().asFile) }
}

apply from: rootProject.file('gradle/publishing.gradle')

sourceSets {
    protocolVerification {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    }
}
tasks.register('verifyFabricProtocol', JavaExec) {
    group = 'verification'
    description = 'Checks real ViaFabricPlus selected targets and native startup fallback.'
    dependsOn tasks.named('protocolVerificationClasses')
    classpath = sourceSets.protocolVerification.runtimeClasspath
    mainClass = 'cn.pupperclient.fabric.FabricProtocolChecks'
}
check.dependsOn verifyFabricProtocol

apply from: rootProject.file('gradle/smoke.gradle')
apply from: rootProject.file('gradle/mixin-verification.gradle')
apply from: rootProject.file('gradle/dev-runtime.gradle')
